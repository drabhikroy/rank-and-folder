name: Release

# Builds the zip and publishes it whenever a version tag is pushed, so a release
# never depends on whatever happened to be on one person's Mac.
on:
  push:
    tags: ['v*']

# A tag build publishes a release, so it needs write access to contents and
# nothing else. A moving tag such as v3 can be repointed at any commit by
# whoever controls the action repository, so the actions below are pinned to
# the commit each tag named when it was reviewed. Dependabot still proposes
# updates, and each one arrives as a reviewable change of commit.
permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The app uses macOS 26 toolbar API. An #available check gates it at run
      # time, but the symbols still have to exist in the SDK to compile at all,
      # so the newest Xcode on the runner is the one to build with. Picking the
      # newest rather than naming a version keeps this working as the runner
      # image moves on.
      - name: Select Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -switch "$newest"
          xcodebuild -version
          xcodebuild -showsdks | grep macosx

      - name: Install librsvg for the icon
        run: brew install librsvg

      - name: Run core tests
        run: swift test

      # Runs headless, so the script skips the Finder window styling and the
      # disk image keeps a default layout. Everything else is identical to a
      # build made on a desktop.
      - name: Build the disk image and the zip
        run: ./Scripts/build-standalone.sh

      - name: Show what was built
        run: |
          ls -lh dist
          cat dist/SHA256SUMS.txt

      # The notes are built from this version's changelog section, so a release
      # says what changed in it rather than repeating the description of the
      # app that every release shares.
      - name: Build the release notes
        run: ./Scripts/release-notes.sh > "$RUNNER_TEMP/release-notes.md"

      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          body_path: ${{ runner.temp }}/release-notes.md
          draft: true
