<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Rank &amp; Folder">
  <title>Rank &amp; Folder monochrome appearance</title>
  <desc>The monochrome source for the tinted and clear appearances on macOS 26. A single tint collapses every hue to one color, which would merge the three levels, so the levels step by brightness instead.</desc>

  <defs>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="184"/>
    </clipPath>
  </defs>

  <!-- Field -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#101010"/>

  <g clip-path="url(#tile)">
    <!-- Folder -->
    <path d="M218 232H418L499 313H806A40 40 0 0 1 846 353V768A40 40 0 0 1 806 808H218A40 40 0 0 1 178 768V272A40 40 0 0 1 218 232Z" fill="#FFFFFF"/>

    <!-- Branch lines, drawn before the bars so no line crosses over one -->
    <path d="M251 416V668" fill="none" stroke="#6B6B6B" stroke-width="15" stroke-linecap="butt"/>
    <path d="M251 464A18 18 0 0 0 269 482H334" fill="none" stroke="#6B6B6B" stroke-width="15" stroke-linecap="butt"/>
    <path d="M251 668A18 18 0 0 0 269 686H334" fill="none" stroke="#6B6B6B" stroke-width="15" stroke-linecap="butt"/>
    <path d="M344 492V592" fill="none" stroke="#6B6B6B" stroke-width="15" stroke-linecap="butt"/>
    <path d="M344 528A18 18 0 0 0 362 546H430" fill="none" stroke="#6B6B6B" stroke-width="15" stroke-linecap="butt"/>
    <path d="M344 592A18 18 0 0 0 362 610H430" fill="none" stroke="#6B6B6B" stroke-width="15" stroke-linecap="butt"/>

    <!-- Section headings and the items under them -->
    <rect x="228" y="380" width="424" height="46" rx="23" fill="#2B2B2B"/>
    <rect x="324" y="462" width="366" height="40" rx="20" fill="#5E5E5E"/>
    <rect x="420" y="526" width="314" height="40" rx="20" fill="#8E8E8E"/>
    <rect x="420" y="590" width="246" height="40" rx="20" fill="#8E8E8E"/>
    <rect x="324" y="666" width="336" height="40" rx="20" fill="#5E5E5E"/>
  </g>
</svg>
